<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pac-Man Game</title>
  <style>
    body {
      text-align: center;
      background-color: #111;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    h1 {
      color: yellow;
      margin-bottom: 10px;
    }

    canvas {
      background: black;
      border: 3px solid yellow;
      margin-top: 10px;
    }

    .info {
      margin-top: 10px;
      font-size: 20px;
    }

    .message {
      margin-top: 12px;
      font-size: 18px;
      color: #ffd54a;
      min-height: 24px;
      font-weight: bold;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 16px;
      background: yellow;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: orange;
    }
  </style>
</head>
<body>

  <h1>Pac-Man Game</h1>
  <canvas id="game" width="400" height="400"></canvas>
  <div class="info">Score: <span id="score">0</span></div>
  <div class="message" id="message">Press any arrow key to start</div>
  <button onclick="resetGame()">Restart</button>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const size = 20;
    let score = 0;
    let count = 0;
    let mouth = 0.2;
    let mouthStep = 0.03;

    let pacman = { x: 200, y: 200, dx: 0, dy: 0 };
    let ghost = { x: 100, y: 100, dx: size, dy: 0 };
    let dots = [];
    let gameStarted = false;
    let gameOver = false;

    function createDots() {
      dots = [];
      for (let i = 0; i < 40; i++) {
        dots.push({
          x: Math.floor(Math.random() * 20) * size,
          y: Math.floor(Math.random() * 20) * size
        });
      }
    }

    function drawPacman() {
      let start = mouth;
      let end = Math.PI * 2 - mouth;

      if (pacman.dx < 0) {
        start = Math.PI + mouth;
        end = Math.PI - mouth;
      } else if (pacman.dy < 0) {
        start = 1.5 * Math.PI + mouth;
        end = 1.5 * Math.PI - mouth;
      } else if (pacman.dy > 0) {
        start = 0.5 * Math.PI + mouth;
        end = 0.5 * Math.PI - mouth;
      }

      ctx.fillStyle = "yellow";
      ctx.beginPath();
      ctx.arc(pacman.x + 10, pacman.y + 10, 10, start, end);
      ctx.lineTo(pacman.x + 10, pacman.y + 10);
      ctx.fill();

      mouth += mouthStep;
      if (mouth > 0.35 || mouth < 0.1) {
        mouthStep = -mouthStep;
      }
    }

    function drawGhost() {
      let x = ghost.x + 10;
      let y = ghost.y + 10;

      ctx.fillStyle = "red";
      ctx.beginPath();
      ctx.arc(x, y, 10, Math.PI, 0);
      ctx.lineTo(x + 10, y + 10);
      ctx.lineTo(x + 5, y + 5);
      ctx.lineTo(x, y + 10);
      ctx.lineTo(x - 5, y + 5);
      ctx.lineTo(x - 10, y + 10);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "white";
      ctx.beginPath();
      ctx.arc(x - 4, y - 2, 2, 0, Math.PI * 2);
      ctx.arc(x + 4, y - 2, 2, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawDots() {
      ctx.fillStyle = "white";
      for (let i = 0; i < dots.length; i++) {
        let dot = dots[i];
        ctx.beginPath();
        ctx.arc(dot.x + 10, dot.y + 10, 3, 0, Math.PI * 2);
        ctx.fill();

        if (pacman.x === dot.x && pacman.y === dot.y) {
          dots.splice(i, 1);
          score++;
          document.getElementById("score").innerText = score;
          i--;
        }
      }
    }

    function moveGhost() {
      if (Math.random() < 0.05) {
        let directions = [
          { dx: size, dy: 0 },
          { dx: -size, dy: 0 },
          { dx: 0, dy: size },
          { dx: 0, dy: -size }
        ];
        let randomMove = directions[Math.floor(Math.random() * directions.length)];
        ghost.dx = randomMove.dx;
        ghost.dy = randomMove.dy;
      }

      ghost.x += ghost.dx;
      ghost.y += ghost.dy;

      if (ghost.x < 0) ghost.x = canvas.width - size;
      if (ghost.x >= canvas.width) ghost.x = 0;
      if (ghost.y < 0) ghost.y = canvas.height - size;
      if (ghost.y >= canvas.height) ghost.y = 0;
    }

    function update() {
      if (gameOver) return;

      if (gameStarted) {
        pacman.x += pacman.dx;
        pacman.y += pacman.dy;

        if (pacman.x < 0) pacman.x = canvas.width - size;
        if (pacman.x >= canvas.width) pacman.x = 0;
        if (pacman.y < 0) pacman.y = canvas.height - size;
        if (pacman.y >= canvas.height) pacman.y = 0;

        moveGhost();
      }

      if (pacman.x === ghost.x && pacman.y === ghost.y) {
        gameOver = true;
        pacman.dx = 0;
        pacman.dy = 0;
        document.getElementById("message").innerText = "Game Over! Click Restart to play again";
      }

      if (dots.length === 0 && gameStarted) {
        gameOver = true;
        pacman.dx = 0;
        pacman.dy = 0;
        document.getElementById("message").innerText = "You Win! Click Restart to play again";
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawDots();
      drawPacman();
      drawGhost();
    }

    function gameLoop() {
      requestAnimationFrame(gameLoop);
      count++;
      if (count < 8) return;
      count = 0;

      update();
      draw();
    }

    function resetGame() {
      pacman = { x: 200, y: 200, dx: 0, dy: 0 };
      ghost = { x: 100, y: 100, dx: size, dy: 0 };
      score = 0;
      gameStarted = false;
      gameOver = false;
      document.getElementById("score").innerText = score;
      document.getElementById("message").innerText = "Press any arrow key to start";
      createDots();
    }

    document.addEventListener("keydown", function(e) {
      if (gameOver) return;

      if (e.key === "ArrowUp") {
        pacman.dx = 0;
        pacman.dy = -size;
        gameStarted = true;
      } else if (e.key === "ArrowDown") {
        pacman.dx = 0;
        pacman.dy = size;
        gameStarted = true;
      } else if (e.key === "ArrowLeft") {
        pacman.dx = -size;
        pacman.dy = 0;
        gameStarted = true;
      } else if (e.key === "ArrowRight") {
        pacman.dx = size;
        pacman.dy = 0;
        gameStarted = true;
      }

      if (gameStarted) {
        document.getElementById("message").innerText = "";
      }
    });

    createDots();
    gameLoop();
  </script>

</body>
</html>
