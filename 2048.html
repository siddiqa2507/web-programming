<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>2048 Game</title>
<style>
    body {
        background: #faf8ef;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    h1 {
        margin-top: 20px;
    }

    #score {
        font-size: 20px;
        margin: 10px;
    }

    .grid {
        width: 320px;
        height: 320px;
        background: #bbada0;
        margin: 20px auto;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        padding: 10px;
        border-radius: 10px;
    }

    .cell {
        width: 70px;
        height: 70px;
        background: #cdc1b4;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
        font-weight: bold;
        border-radius: 5px;
    }
</style>
</head>
<body>

<h1>2048 Game</h1>
<div id="score">Score: 0</div>
<div class="grid" id="grid"></div>

<script>
const grid = document.getElementById("grid");
let cells = [];
let score = 0;

function createGrid() {
    grid.innerHTML = "";
    cells = [];
    for (let i = 0; i < 16; i++) {
        let div = document.createElement("div");
        div.classList.add("cell");
        div.innerText = "";
        grid.appendChild(div);
        cells.push(div);
    }
}

let board = new Array(16).fill(0);

function addNumber() {
    let empty = board.map((val, i) => val === 0 ? i : null).filter(v => v !== null);
    if (empty.length === 0) return;
    let index = empty[Math.floor(Math.random() * empty.length)];
    board[index] = Math.random() > 0.1 ? 2 : 4;
}

function draw() {
    board.forEach((val, i) => {
        cells[i].innerText = val === 0 ? "" : val;
    });
    document.getElementById("score").innerText = "Score: " + score;
}

function slide(row) {
    row = row.filter(val => val);
    for (let i = 0; i < row.length - 1; i++) {
        if (row[i] === row[i+1]) {
            row[i] *= 2;
            score += row[i];
            row[i+1] = 0;
        }
    }
    return row.filter(val => val);
}

function moveLeft() {
    for (let i = 0; i < 4; i++) {
        let row = board.slice(i*4, i*4+4);
        let newRow = slide(row);
        while (newRow.length < 4) newRow.push(0);
        for (let j = 0; j < 4; j++) {
            board[i*4 + j] = newRow[j];
        }
    }
}

function rotate() {
    let newBoard = new Array(16);
    for (let i = 0; i < 4; i++) {
        for (let j = 0; j < 4; j++) {
            newBoard[j*4 + i] = board[i*4 + j];
        }
    }
    board = newBoard.reverse();
}

function move(direction) {
    for (let i = 0; i < direction; i++) rotate();
    moveLeft();
    for (let i = 0; i < (4 - direction); i++) rotate();
    addNumber();
    draw();
}

document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") move(0);
    if (e.key === "ArrowUp") move(1);
    if (e.key === "ArrowRight") move(2);
    if (e.key === "ArrowDown") move(3);
});

function startGame() {
    createGrid();
    board = new Array(16).fill(0);
    score = 0;
    addNumber();
    addNumber();
    draw();
}

startGame();
</script>

</body>
</html>
