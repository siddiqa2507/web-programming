<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rock Paper Scissors</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #141e30, #243b55);
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    h1 {
      margin-top: 30px;
      font-size: 40px;
    }

    .choices {
      margin: 40px 0;
    }

    button {
      padding: 15px 30px;
      margin: 10px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.1);
      background-color: #00c6ff;
      color: black;
    }

    .result {
      font-size: 24px;
      margin-top: 20px;
    }

    .score {
      margin-top: 20px;
      font-size: 20px;
    }
  </style>
</head>
<body>

  <h1>Rock Paper Scissors</h1>

  <div class="choices">
    <button onclick="playGame('rock')">🪨 Rock</button>
    <button onclick="playGame('paper')">📄 Paper</button>
    <button onclick="playGame('scissors')">✂️ Scissors</button>
  </div>

  <div class="result" id="result">Make your move!</div>
  <div class="score">
    You: <span id="userScore">0</span> | 
    Computer: <span id="compScore">0</span>
  </div>

  <script>
    let userScore = 0;
    let compScore = 0;

    function playGame(userChoice) {
      const choices = ['rock', 'paper', 'scissors'];
      const compChoice = choices[Math.floor(Math.random() * 3)];

      let resultText = "";

      if (userChoice === compChoice) {
        resultText = "It's a Draw!";
      } else if (
        (userChoice === 'rock' && compChoice === 'scissors') ||
        (userChoice === 'paper' && compChoice === 'rock') ||
        (userChoice === 'scissors' && compChoice === 'paper')
      ) {
        resultText = "You Win!";
        userScore++;
      } else {
        resultText = "You Lose!";
        compScore++;
      }

      document.getElementById("result").innerText =
        `You chose ${userChoice}, Computer chose ${compChoice}. ${resultText}`;

      document.getElementById("userScore").innerText = userScore;
      document.getElementById("compScore").innerText = compScore;
    }
  </script>

</body>
</html>
